[package]
name        = "polar-bear-hft-crypto"
version     = "0.3.1"
edition     = "2024"
rust-version = "1.93.1"
authors     = ["Murtaza Ali Imtiaz <very.kool.king@gmail.com>"]
description = "Cryptographic signing layer for high-frequency trading: ECDSA/Ed25519 forward-engineering + 7-exchange API authentication"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/murtazaai/polar-bear-hft-crypto"
keywords    = ["hft", "crypto", "ecdsa", "ed25519", "defi"]
categories  = ["cryptography", "finance", "algorithms"]
readme      = "README.md"

[[bin]]
name = "polar-bear-hft-crypto"
path = "src/main.rs"

# Docs.rs - build all features, inject the docsrs cfg flag so conditional items
# are visible.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Workspace-wide lints - mirrors the rig upstream lint table.
[lints.rust]
unused       = "warn"
missing_docs = "warn"

[lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allow common false-positive pedantic lints.
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"

# ── FEATURES ──────────────────────────────────────────────────────────────────
[features]
default  = []
ai-agent = ["dep:rig-core"]

# ── CORE AI (ARC) - optional ──────────────────────────────────────────────────
[dependencies]
# Rig (ARC) - Agentic AI framework (optional; gates AI agent features)
rig-core = { version = "^0.37", features = ["rustls"], optional = true }

# ── ASYNC RUNTIME ─────────────────────────────────────────────────────────────
tokio = { version = "^1", features = ["full"] }

# ── CRYPTOGRAPHY ──────────────────────────────────────────────────────────────
k256          = { version = "^0.13", features = ["ecdsa", "sha256", "arithmetic"] }
ed25519-dalek = { version = "^2",   features = ["rand_core"] }
hmac          = "^0.12"
sha2          = "^0.10"

# ── ENCODING ──────────────────────────────────────────────────────────────────
hex    = "^0.4"
base64 = { version = "^0.22", features = ["std"] }

# ── SERIALIZATION ─────────────────────────────────────────────────────────────
serde      = { version = "^1", features = ["derive"] }
serde_json = "^1"

# ── CLI ───────────────────────────────────────────────────────────────────────
clap = { version = "^4", features = ["derive"] }

# ── LOGGING ───────────────────────────────────────────────────────────────────
tracing            = "^0.1"
tracing-subscriber = { version = "^0.3", features = ["env-filter", "fmt"] }

# ── ERROR HANDLING ────────────────────────────────────────────────────────────
anyhow    = "^1"
thiserror = "^2"

# ── TIME / NONCE ──────────────────────────────────────────────────────────────
chrono = { version = "^0.4", features = ["serde"] }

# ── RANDOM ────────────────────────────────────────────────────────────────────
rand = "^0.8"

# ── ENV CONFIG ────────────────────────────────────────────────────────────────
dotenvy = "^0.15"

# ── DEV / TEST ────────────────────────────────────────────────────────────────
[dev-dependencies]
pretty_assertions = "^1"
tokio-test        = "^0.4"

# ── RELEASE PROFILE ───────────────────────────────────────────────────────────
# Mirrors rig's workspace release profile: maximise performance and
# minimise binary size through LTO and single-codegen-unit compilation.
[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
panic         = "abort"
strip         = "debuginfo"
