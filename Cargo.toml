[package]
name        = "polar-bear-hft-crypto"
version     = "0.3.1"
edition     = "2021"
rust-version = "1.93.1"
authors     = ["Murtaza Ali Imtiaz <very.kool.king@gmail.com>"]
description = "Cryptographic signing layer for high-frequency trading: ECDSA/Ed25519 forward-engineering + 7-exchange API authentication"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/murtazaai/polar-bear-hft-crypto"
keywords    = ["hft", "crypto", "ecdsa", "ed25519", "defi"]
categories  = ["cryptography", "finance", "algorithms"]
readme      = "README.md"

[[bin]]
name = "polar-bear-hft-crypto"
path = "src/main.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unused       = "warn"
missing_docs = "warn"

[lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"

[features]
default  = []
ai-agent = ["dep:rig-core"]

[dependencies]
rig-core = { version = "^0.37", features = ["rustls"], optional = true }

tokio = { version = "^1", features = ["full"] }

k256          = { version = "^0.13", features = ["ecdsa", "sha256", "arithmetic"] }
ed25519-dalek = { version = "=2.1.1", features = ["rand_core"] }
hmac          = "^0.12"
sha2          = "^0.10"

hex    = "^0.4"
base64 = { version = "^0.22", features = ["std"] }

serde      = { version = "^1", features = ["derive"] }
serde_json = "^1"

clap = { version = "=4.4.18", features = ["derive"] }

tracing            = "^0.1"
tracing-subscriber = { version = "^0.3", features = ["env-filter", "fmt"] }

anyhow    = "^1"
thiserror = "=1.0.69"

chrono = { version = "^0.4", features = ["serde"] }

rand = "^0.8"

dotenvy = "^0.15"

[dev-dependencies]
pretty_assertions = "^1"
tokio-test        = "^0.4"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
panic         = "abort"
strip         = "debuginfo"
